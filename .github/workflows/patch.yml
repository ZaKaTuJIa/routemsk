name: Replace ROUTEMSK Telegram link

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/patch.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: routemsk-telegram-link-main
  cancel-in-progress: false

jobs:
  replace-link:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Replace link in all tracked files
        shell: bash
        run: |
          python3 - <<'PY'
          import subprocess
          from pathlib import Path

          old = b'Mary_' + b'Romanova_tg'
          new = b'route_msk_bot'
          paths = subprocess.check_output(['git', 'ls-files', '-z']).split(b'\0')
          changed = []
          replacements = 0

          for raw_path in filter(None, paths):
              path = Path(raw_path.decode('utf-8', 'surrogateescape'))
              if not path.is_file() or path.is_symlink():
                  continue
              original = path.read_bytes()
              count = original.count(old)
              if count:
                  path.write_bytes(original.replace(old, new))
                  changed.append(str(path))
                  replacements += count

          print(f'Replaced {replacements} occurrence(s) in {len(changed)} file(s).')
          for path in changed:
              print(path)

          remaining = [raw.decode('utf-8', 'surrogateescape')
                       for raw in filter(None, paths)
                       if (p := Path(raw.decode('utf-8', 'surrogateescape'))).is_file()
                       and not p.is_symlink() and old in p.read_bytes()]
          if remaining:
              raise SystemExit('Old link remains in: ' + ', '.join(remaining))
          PY

      - name: Review and commit
        shell: bash
        env:
          ACTOR: ${{ github.actor }}
          ACTOR_ID: ${{ github.actor_id }}
        run: |
          git diff --check
          if git diff --quiet; then
            echo 'No old links found. Nothing to commit.'
            exit 0
          fi

          git diff --stat
          git config user.name "$ACTOR"
          git config user.email "${ACTOR_ID}+${ACTOR}@users.noreply.github.com"
          git add -u
          git commit -m "Replace Telegram support link with bot"
          git push origin HEAD:main
