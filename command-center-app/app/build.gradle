plugins { id 'com.android.application' }

android {
    namespace 'ru.ivan.commandcenter'
    compileSdk 35

    defaultConfig {
        applicationId 'ru.ivan.commandcenter'
        minSdk 24
        targetSdk 35
        versionCode 7
        versionName '0.3.3'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}
